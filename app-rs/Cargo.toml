[package]
name = "auralis-studio-rs"
version = "0.1.0"
edition = "2021"
description = "Auralis Studio - PitchForge product UI in Rust (Slint)"
default-run = "auralis-studio-rs"
publish = false
build = "build.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "renderer-winit-software", "compat-1-18", "backend-default"] }
i-slint-core = { version = "1.19", features = ["image-decoders"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.19"

[workspace]
